<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- 帮手, the Hàndy mascot: flat sitting monkey, red 帮 collar tag.
       Shared base geometry; each pose file only swaps the eyes / arms / props. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="3.4s" repeatCount="indefinite"/>
    <!-- tail -->
    <path d="M64 76 C84 80 90 58 74 52" fill="none" stroke="#E0AE73" stroke-width="8" stroke-linecap="round"/>
    <circle cx="74" cy="52" r="4.2" fill="#C98F52"/>
    <!-- feet -->
    <ellipse cx="34" cy="83" rx="8" ry="6" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <ellipse cx="62" cy="83" rx="8" ry="6" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <circle cx="31" cy="85" r="1.1" fill="#17150F"/><circle cx="37" cy="85" r="1.1" fill="#17150F"/>
    <circle cx="59" cy="85" r="1.1" fill="#17150F"/><circle cx="65" cy="85" r="1.1" fill="#17150F"/>
    <!-- body + belly -->
    <ellipse cx="48" cy="66" rx="23" ry="20" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <ellipse cx="48" cy="70" rx="13" ry="12" fill="#FBF3E2"/>
    <!-- arms -->
    <ellipse cx="26" cy="62" rx="7.5" ry="10" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <ellipse cx="70" cy="62" rx="7.5" ry="10" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <!-- ears -->
    <circle cx="25" cy="21" r="11.5" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <circle cx="71" cy="21" r="11.5" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <circle cx="25" cy="21" r="5.8" fill="#C98F52"/>
    <circle cx="71" cy="21" r="5.8" fill="#C98F52"/>
    <!-- head + face -->
    <circle cx="48" cy="34" r="21.5" fill="#E0AE73" stroke="#17150F" stroke-width="2.2"/>
    <ellipse cx="48" cy="38" rx="15.5" ry="13.5" fill="#FBF3E2"/>
    <path d="M34 27 Q39 24 43.5 27" fill="none" stroke="#17150F" stroke-width="2" stroke-linecap="round"/>
    <path d="M52.5 27 Q57 24 62 27" fill="none" stroke="#17150F" stroke-width="2" stroke-linecap="round"/>
    <!-- eyes (blinking) -->
    <g transform="translate(39.5,34)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1;1 1" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
        <circle r="5.6" fill="#E8A93A"/>
        <circle r="2.7" fill="#17150F"/>
        <circle cx="-1.6" cy="-1.7" r="1.5" fill="#FBFBF8"/>
      </g>
    </g>
    <g transform="translate(56.5,34)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1;1 1" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
        <circle r="5.6" fill="#E8A93A"/>
        <circle r="2.7" fill="#17150F"/>
        <circle cx="-1.6" cy="-1.7" r="1.5" fill="#FBFBF8"/>
      </g>
    </g>
    <!-- nose + mouth -->
    <ellipse cx="48" cy="44" rx="2.3" ry="1.7" fill="#17150F"/>
    <path d="M42.5 48.5 Q48 53 53.5 48.5" fill="none" stroke="#17150F" stroke-width="2" stroke-linecap="round"/>
    <!-- collar + 帮 tag -->
    <path d="M29 52 Q48 63 67 52" fill="none" stroke="#C8402A" stroke-width="5" stroke-linecap="round"/>
    <rect x="42.5" y="57" width="11" height="11" rx="2.5" fill="#C8402A"/>
    <text x="48" y="65.3" font-family="PingFang SC, Hiragino Sans GB, system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle" fill="#FBF3E2">帮</text>
  </g>
</svg>
