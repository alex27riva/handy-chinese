<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hàndy</title>

<!-- PWA meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hàndy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1208">
<link rel="manifest" href="./manifest.json">

<!-- Inline SVG favicon / app icon (red seal with 中) -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23c0392b'/><text x='90' y='128' font-size='110' text-anchor='middle' font-family='PingFang SC,sans-serif' font-weight='700' fill='%23f5efe3'>汉</text></svg>">

<link rel="stylesheet" href="./style.css">
<script>
  // Pre-paint: apply theme + pinyin preference before first render so there is
  // no flash. The module script (js/app.js) is deferred, so it cannot do this.
  // Detection logic mirrors js/settings.js.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (localStorage.getItem('pinyinHidden') === '1') document.documentElement.dataset.pinyin = 'hidden';
    } catch (e) {}
  })();
</script>
</head>
<body>

<header>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang="en" type="button">EN</button>
    <button data-lang="it" type="button">IT</button>
  </div>
  <div class="header-rule"></div>
  <h1>Hàndy</h1>
  <p class="subtitle" data-i18n="subtitle">Essential Chinese for apps, food, travel & signs</p>
</header>

<div class="install-hint" id="installHint" hidden>
  <span class="install-emoji" aria-hidden="true">📱</span>
  <span data-i18n-html="installHint"><strong>Works offline!</strong> Tap Safari's Share button → <strong>Add to Home Screen</strong> to install as an app. Perfect for your trip.</span>
  <button id="installBtn" class="install-btn" hidden data-i18n="installBtnLabel">Install</button>
  <button class="close-hint" id="hintClose" type="button" aria-label="Dismiss">✕</button>
</div>

<div class="tabs" id="tabs" role="tablist"></div>
<div class="toolbar">
  <div class="search-wrap">
    <div class="search-field">
      <input type="search" id="searchInput" class="search-input" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="searchClear" class="search-clear" hidden aria-label="Clear search">✕</button>
    </div>
  </div>
  <button class="fav-btn" id="favBtn" aria-label="View favorites" title="Favorites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
  </button>
  <button class="pinyin-btn" id="pinyinBtn" aria-label="Toggle pinyin" title="Hide/show pinyin"><span lang="zh-CN">拼</span></button>
  <button class="quiz-btn" id="quizBtn" aria-label="Toggle quiz mode" title="Quiz mode">?</button>
  <button class="about-btn" id="aboutBtn" aria-label="About and tips" aria-expanded="false" title="About">i</button>
  <div class="about-panel" id="aboutPanel" hidden>
    <div class="about-name">hàn <span class="about-hanzi" lang="zh-CN">汉</span> + handy</div>
    <div class="about-tagline" data-i18n="aboutTagline">hàn = Chinese · handy = useful</div>
    <ul class="about-tips" data-i18n-html="aboutTips"></ul>
  </div>
</div>
<div id="panels"></div>

<!-- Add-phrase sheet for the 我的 (custom phrases) tab; wired in js/custom.js -->
<div class="sheet-overlay" id="addSheet" hidden>
  <form class="sheet" id="addForm" role="dialog" aria-labelledby="addTitle" autocomplete="off">
    <div class="sheet-header">
      <h2 id="addTitle" lang="zh-CN">添加</h2>
      <button class="sheet-close" id="addClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <label class="field">
        <span class="field-label"><span lang="zh-CN">汉字</span> · <span data-i18n="fieldHanzi">Hanzi</span></span>
        <input id="addHanzi" class="field-input field-hanzi" lang="zh-CN" required autocorrect="off" spellcheck="false" placeholder="你好">
      </label>
      <label class="field">
        <span class="field-label"><span data-i18n="fieldPinyin">Pinyin</span> <span class="field-opt" data-i18n="fieldOptional">optional</span></span>
        <input id="addPinyin" class="field-input field-pinyin" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="nǐ hǎo">
      </label>
      <label class="field">
        <span class="field-label"><span data-i18n="fieldMeaning">Meaning</span></span>
        <input id="addMeaning" class="field-input" required data-i18n-placeholder="fieldMeaningPlaceholder">
      </label>
      <label class="field">
        <span class="field-label"><span data-i18n="fieldNote">Note</span> <span class="field-opt" data-i18n="fieldOptional">optional</span></span>
        <input id="addNote" class="field-input" data-i18n-placeholder="fieldNotePlaceholder">
      </label>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="addSubmit" type="submit" data-i18n="addSubmit">Add</button>
      </div>
    </div>
  </form>
</div>
<!-- JSON backup import (triggered by the 我的 action bar) -->
<input type="file" id="importFile" accept=".json,application/json" hidden>


<div class="show-mode" id="showMode" role="dialog" aria-modal="true" aria-labelledby="showHanzi" hidden>
  <button class="show-close" id="showClose" type="button" aria-label="Close">✕</button>
  <div class="show-body">
    <div class="show-hanzi" id="showHanzi" lang="zh-CN"></div>
    <div class="show-pinyin" id="showPinyin"></div>
    <div class="show-meaning" id="showMeaning"></div>
  </div>
  <div class="show-actions">
    <button class="show-btn" id="showSpeak" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <span data-i18n="showSpeak">Speak</span>
    </button>
    <button class="show-btn" id="showCopy" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span data-i18n="showCopy">Copy</span>
    </button>
    <button class="show-btn" id="showStar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span data-i18n="showStar">Save</span>
    </button>
    <a class="show-btn" id="showPleco" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
      <span>Pleco</span>
    </a>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<button class="toast toast-update" id="updateToast" type="button" hidden>
  <span aria-hidden="true">↻</span> <span data-i18n="updateReady">New version ready · tap to reload</span>
</button>
<div class="app-version" id="appVersion" aria-hidden="true"></div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
